services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: annas
      POSTGRES_USER: annas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ingest/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    shm_size: 1gb
    command: >
      postgres
        -c shared_buffers=4GB
        -c effective_cache_size=8GB
        -c work_mem=256MB
        -c maintenance_work_mem=1GB
        -c max_wal_size=2GB
        -c checkpoint_completion_target=0.9
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U annas"]
      interval: 5s
      timeout: 5s
      retries: 5

  mcp-server:
    build: ./server
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${MCP_PORT:-3001}:3001"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: annas
      PGUSER: annas
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      RATE_LIMIT: ${RATE_LIMIT:-60}
      TRUST_PROXY: ${TRUST_PROXY:-loopback, linklocal, uniquelocal}
      TRANSPORT: ${TRANSPORT:-http}
      PORT: "3001"
      CACHE_MODE: ${CACHE_MODE:-memory}
      CACHE_DIR: /data/cache
      FILE_CACHE_MB: ${FILE_CACHE_MB:-2000}
      TEXT_CACHE_MB: ${TEXT_CACHE_MB:-500}
      MAX_DOWNLOAD_MB: ${MAX_DOWNLOAD_MB:-200}
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      XDG_CONFIG_HOME: /tmp/.config
    volumes:
      - cache:/data/cache
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    shm_size: ${MCP_SHM_SIZE:-512m}
    depends_on:
      postgres:
        condition: service_healthy

  ingest:
    build: ./ingest
    environment:
      DATABASE_URL: postgresql://annas:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/annas
    volumes:
      - aac-data:/data/aac:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - ingest

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - mcp-server

  download:
    build: ./downloader
    environment:
      COLLECTIONS: ${COLLECTIONS:-zlib3_records,upload_records,ia2_records,nexusstc_records}
      ANNAS_BASE_URL: ${ANNAS_BASE_URL:-annas-archive.gl}
      OUTPUT_DIR: /data/aac
      SEED_TIME: ${SEED_TIME:-0}
    volumes:
      - aac-data:/data/aac
    profiles:
      - download

volumes:
  pgdata:
  cache:
  aac-data:
