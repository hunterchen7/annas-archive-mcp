name: Server checks

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-checks.yml"
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/server-checks.yml"

permissions:
  contents: read

concurrency:
  group: server-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: docker build --tag annas-archive-mcp:ci .
