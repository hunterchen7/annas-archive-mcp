name: Server checks

on:
  pull_request:
    paths:
      - "server/**"
      - "docker-compose.yml"
      - ".env.example"
      - "ingest/oauth-schema.sql"
      - "ingest/sync-password.sql"
      - ".github/workflows/server-checks.yml"
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "docker-compose.yml"
      - ".env.example"
      - "ingest/oauth-schema.sql"
      - "ingest/sync-password.sql"
      - ".github/workflows/server-checks.yml"

permissions:
  contents: read

concurrency:
  group: server-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: docker build --tag annas-archive-mcp:ci .
      - name: Validate Compose configuration
        working-directory: .
        env:
          POSTGRES_PASSWORD: ci-compose-only-password
        run: docker compose config --quiet
      - name: Test existing-volume password rotation
        working-directory: .
        run: |
          docker run -d --name aa-password-migration \
            -p 127.0.0.1:55432:5432 \
            -e POSTGRES_DB=annas \
            -e POSTGRES_USER=annas \
            -e POSTGRES_PASSWORD=old-ci-password \
            -v "$PWD/ingest/sync-password.sql:/sync-password.sql:ro" \
            -v "$PWD/ingest/oauth-schema.sql:/oauth-schema.sql:ro" \
            postgres:17-alpine
          database_ready=false
          for attempt in $(seq 1 30); do
            if docker exec --env PGPASSWORD=old-ci-password aa-password-migration \
              psql --host 127.0.0.1 --username annas --dbname postgres \
              --command "SELECT 1" >/dev/null 2>&1; then
              database_ready=true
              break
            fi
            sleep 1
          done
          if [ "$database_ready" != true ]; then
            docker logs aa-password-migration
            exit 1
          fi
          docker exec --user postgres --env POSTGRES_PASSWORD=new-ci-password \
            aa-password-migration \
            psql --username annas --dbname postgres --file /sync-password.sql
          docker exec --env PGPASSWORD=new-ci-password aa-password-migration \
            psql --host 127.0.0.1 --username annas --dbname postgres \
            --command "SELECT 1"
      - name: Test OAuth schema is repeatable
        working-directory: .
        run: |
          docker exec --env PGPASSWORD=new-ci-password aa-password-migration \
            psql --host 127.0.0.1 --username annas --dbname annas \
            --file /oauth-schema.sql
          docker exec --env PGPASSWORD=new-ci-password aa-password-migration \
            psql --host 127.0.0.1 --username annas --dbname annas \
            --command "DO \$\$ BEGIN
              IF to_regclass('public.oauth_clients') IS NULL
                 OR to_regclass('public.oauth_authorization_requests') IS NULL
                 OR to_regclass('public.oauth_connections') IS NULL
                 OR to_regclass('public.oauth_authorization_codes') IS NULL
                 OR to_regclass('public.oauth_access_tokens') IS NULL
                 OR to_regclass('public.oauth_refresh_tokens') IS NULL
                 OR to_regclass('public.idx_oauth_connections_client_key') IS NULL
              THEN
                RAISE EXCEPTION 'OAuth schema is incomplete';
              END IF;
            END \$\$;"
          docker exec --env PGPASSWORD=new-ci-password aa-password-migration \
            psql --host 127.0.0.1 --username annas --dbname annas \
            --file /oauth-schema.sql
      - name: Test OAuth flow against Postgres
        working-directory: server
        env:
          OAUTH_INTEGRATION_DATABASE_URL: postgresql://annas:new-ci-password@127.0.0.1:55432/annas
        run: bun test src/oauthProvider.integration.test.ts
      - name: Clean up migration test
        if: always()
        working-directory: .
        run: docker rm --force aa-password-migration 2>/dev/null || true
